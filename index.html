<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Entreprise</title>
</head>

<body>

    <div class="flex ">

        <header class="border-2 border-gray-600 w-[15%] h-[585px]">

            <div class="flex justify-center">
                <button id="btnOne" class="border-2 border-blue-500 w-[50%] rounded-[20px] mt-4">ADD</button>
            </div>

        </header>

        <div class="border-8 border-gray-600 w-[85%] h-[590px] ">

            <div class="flex">

                <div class="border-4 border-gray-600 w-[40%] h-[215px]">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                </div>

                <div class="border-4 border-gray-600 w-[30%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                </div>

                <div class="border-4 border-gray-600 w-[30%] h-[215px]">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class="hover:w-[20px]"></button>
                </div>

            </div>
            <div class="border-2 border-gray-600 w-[100%] h-[150px] bg-blue-600"></div>
            <div class="flex ">

                <div class="border-4 border-gray-600 w-[30%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                </div>

                <div class="border-4 border-gray-600 w-[40%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                </div>

                <div class="border-4 border-gray-600 w-[30%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                </div>

            </div>
        </div>
    </div>
    <div id="forma" class="border-2 border-blue-600 w-[50%] h-[580px] rounded-[20px] p-4 bg-white-600">

        <div class="flex mb-2 border w-full h-[80px]">
            <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                <p class="mb-2 px-4">Full name</p>
                <input type="text" placeholder="Enter your full name"
                    class="w-[200px] h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                <p class="mb-2 px-4">Email</p>
                <input type="email" placeholder="Enter your email ..."
                    class="w-[200px] h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
        </div>

        <div class="flex mb-2 border w-full h-[80px]">
            <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                <p class="mb-2 px-4">Photo (URL) </p>
                <input type="text" placeholder=""
                    class="w-[200px] h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                <p class="mb-2 px-4">Roles</p>
                <select name="Roles" id="roles"
                    class="w-[200px] h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="manager">manager</option>
                    <option value="employee">employee</option>
                    <option value="security">security</option>
                    <option value="receptionist">receptionist</option>
                    <option value="cleaning employee">cleaning employee</option>
                    <option value="IT specifics">IT specifics</option>
                </select>
            </div>
        </div>


        <div class="flex mb-2 border w-full h-[80px]">
            <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                <p class="mb-2 px-4">Phone number</p>
                <input type="number" placeholder="Enter your phone number ..."
                    class="w-[200px] h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
        </div>
        <div>

            <div class="flex mb-2 border w-full h-[80px]">
                <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                    <p class="mb-2 px-4">Date of start</p>
                    <input type="date"
                        class="w-[200px] h-full px-8 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                    <p class="mb-2 px-4">Date of fineching</p>
                    <input type="date"
                        class="w-[200px] h-full px-8 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>

            <div class="relative left-[15%] mt-2 w-[70%] h-[30px]">
                <p class="mb-2 px-4">Name of company</p>
                <input type="text" placeholder="Enter his name"
                    class="w-[200px] h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="relative left-[20%] mt-2 w-[50%] h-[50px]">
                <button id="btnTwo"
                    class="w-[200px] h-full bg-blue-500 text-white rounded-[10px] hover:bg-blue-600 transition">addExperience</button>
            </div>
            <div class="relative left-[20%] mt-2 w-[50%] h-[50px]">
                <button id="btnTree"
                    class="w-[200px] h-full bg-blue-500 text-white rounded-[10px] hover:bg-blue-600 transition">add
                    formations</button>
            </div>

        </div>
    </div>


    <script src="main.js"></script>

</body>

</html>

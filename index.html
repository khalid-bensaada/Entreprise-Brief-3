<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Entreprise</title>
</head>

<body>

    <div class="flex ">

        <header class="border-2 border-gray-600 w-[15%] h-[585px]">

            <div class="flex justify-center">
                <button class="border-2 border-blue-500 w-[50%] rounded-[20px] mt-4">ADD</button>
            </div>

        </header>

        <div class="border-8 border-gray-600 w-[85%] h-[590px] ">

            <div class="flex">

                <div class="border-4 border-gray-600 w-[45%] h-[215px]"></div>

                <div class="border-4 border-gray-600 w-[30%] h-[215px] "></div>

                <div class="border-4 border-gray-600 w-[25%] h-[215px]"></div>

            </div>
            <div class="border-2 border-gray-600 w-[100%] h-[150px] bg-blue-600">

            </div>
            <div class="flex ">

                <div class="border-4 border-gray-600 w-[25%] h-[215px] "></div>

                <div class="border-4 border-gray-600 w-[50%] h-[215px] "></div>

                <div class="border-4 border-gray-600 w-[25%] h-[215px] "></div>

            </div>
        </div>
    </div>
    <div class="border-2 border-blue-600 w-[25%] h-[500px] rounded-[20px] p-4">

        <div class="relative left-[15%] mt-4 w-[70%] h-[30px]">
            <input type="text" placeholder="Enter your full name"
                class="w-full h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="relative left-[15%] mt-4 w-[70%] h-[30px]">
            <select name="Roles" id="roles"
                class="w-full h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="manager">manager</option>
                <option value="employee">employee</option>
                <option value="security">security</option>
                <option value="receptionist">receptionist</option>
                <option value="cleaning employee">cleaning employee</option>
                <option value="IT specifics">IT specifics</option>
            </select>
        </div>

        <div class="relative left-[15%] mt-4 w-[70%] h-[30px]">
            <input type="email" placeholder="Enter your email ..."
                class="w-full h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="relative left-[15%] mt-4 w-[70%] h-[30px]">
            <input type="number" placeholder="Enter your phone number ..."
                class="w-full h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="relative left-[15%] mt-4 w-[70%] h-[30px]">
            <input type="text" placeholder="Enter your experience if you have ..."
                class="w-full h-full px-4 rounded-[15px] border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="relative left-[20%] mt-4 w-[50%] h-[50px]">
            <button class="w-full h-full bg-blue-500 text-white rounded-[10px] hover:bg-blue-600 transition">Another
                Exp</button>
        </div>
    </div>


    <script src="main.js"></script>

</body>

</html>

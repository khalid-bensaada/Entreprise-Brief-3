<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Entreprise</title>
</head>

<body>

    <div class="flex ">

        <header class="border-2 border-gray-600 w-[15%] h-[585px]">

            <div class="flex justify-center">
                <button class="border-2 border-blue-500 w-[50%] rounded-[20px] mt-4">ADD</button>
            </div>

        </header>

        <div class="border-8 border-gray-600 w-[85%] h-[585px] ">

            <div class="flex">

                <div class="border-4 border-gray-600 w-[45%] h-[217.5px] bg-black"></div>

                <div class="border-4 border-gray-600 w-[30%] h-[217.5px] bg-green-600"></div>

                <div class="border-4 border-gray-600 w-[25%] h-[217.5px] bg-red-600"></div>

            </div>
            <div class="border-2 border-gray-600 w-[100%] h-[150px] bg-blue-600">

            </div>
            <div class="flex ">

                <div class="border-4 border-gray-600 w-[25%] h-[217.5px] "></div>

                <div class="border-4 border-gray-600 w-[50%] h-[217.5px] "></div>

                <div class="border-4 border-gray-600 w-[25%] h-[217.5px] bg-yellow-600"></div>

            </div>
        </div>
    </div>
    <div>
        <div>
            <input type="text" placeholder="Enter your full name ...">
        </div>
        <div>
            <select name="Roles" id="roles">
                <option value="">manager</option>
                <option value="">employee</option>
                <option value="">security</option>
                <option value="">receptionist</option>
                <option value="">cleaning employee</option>
                <option value="">IT specifics</option>
            </select>
        </div>
        <div>
            <input type="email" placeholder="Enter your email ...">
        </div>
        <div>
            <input type="number" placeholder="Enter your number phone ...">
        </div>
        <div>
            <input type="text" placeholder="Enter your exeperience if you have ...">
            <button>anthor exeperience</button>
        </div>
    </div>

    <script src="main.js"></script>

</body>

</html>

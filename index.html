<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Entreprise</title>
</head>

<body>

    <div class="flex ">

        <header class="border-2 border-gray-600 w-[15%] h-[585px]">

            <div class="flex justify-center">
                <button id="btnOne" class="border-2 border-blue-500 w-[50%] rounded-[20px] mt-4">ADD</button>
            </div>

        </header>

        <div class="border-8 border-gray-600 w-[85%] h-[590px] ">

            <div class="flex">

                <div id="roomOne" class="border-4 border-gray-600 w-[40%] h-[215px]">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                    <p class="flex justify-center items-center text-gray-300 font-bold text-xl">Salle de conférence</p>
                </div>

                <div id="roomTwo" class="border-4 border-gray-600 w-[30%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                    <p class="flex justify-center items-center text-gray-300 font-bold text-xl">Réception</p>
                </div>

                <div id="roomTree" class="border-4 border-gray-600 w-[30%] h-[215px]">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class="hover:w-[20px]"></button>
                    <p class="flex justify-center items-center text-gray-300 font-bold text-xl">Salle de sécurité</p>

                </div>

            </div>
            <div id="kolwar" class="border-2 border-gray-600 w-[100%] h-[150px] bg-blue-600"></div>
            <div class="flex ">

                <div id="roomFor" class="border-4 border-gray-600 w-[30%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                    <p class="flex justify-center items-center text-gray-300 font-bold text-xl">Salle d’archives</p>
                </div>

                <div id="roomFive" class="border-4 border-gray-600 w-[40%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                    <p class="flex justify-center items-center text-gray-300 font-bold text-xl">Salle du personnel</p>
                </div>

                <div id="roomsx" class="border-4 border-gray-600 w-[30%] h-[215px] ">
                    <button><img src="images/plus 1.png" alt="button of add some one to this room" width="50"
                            class=""></button>
                    <p class="flex justify-center items-center text-gray-300 font-bold text-xl">Salle des serveurs</p>
                </div>

            </div>
        </div>
    </div>
    <div id="forma"
        class="hidden border-2 border-blue-600 w-[45%] max-w-[600px] h-[580px] rounded-2xl p-6 bg-white relative left-[15%] bottom-[590px]">

        <div class="overflow-y-auto h-[80vh] space-y-4">

            <!-- Full Name & Email -->
            <div class="flex gap-4">
                <div class="flex-1 flex flex-col">
                    <label for="fullName" class="mb-1 font-medium">Full name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name"
                        class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="flex-1 flex flex-col">
                    <label for="email" class="mb-1 font-medium">Email</label>
                    <input type="email" id="email" placeholder="Enter your email"
                        class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>

            <!-- Photo URL -->
            <div class="flex flex-col">
                <label for="Photo" class="mb-1 font-medium">Photo (URL)</label>
                <input type="text" id="Photo" placeholder="Enter photo URL"
                    class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- Phone & Roles -->
            <div class="flex gap-4">
                <div class="flex-1 flex flex-col">
                    <label for="phone" class="mb-1 font-medium">Phone number</label>
                    <input type="number" id="phone" placeholder="+212 6360212"
                        class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="flex-1 flex flex-col">
                    <label for="roles" class="mb-1 font-medium">Roles</label>
                    <select id="roles"
                        class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="manager">manager</option>
                        <option value="employee">employee</option>
                        <option value="security">security</option>
                        <option value="receptionist">receptionist</option>
                        <option value="cleaning employee">cleaning employee</option>
                        <option value="IT specifics">IT specifics</option>
                    </select>
                </div>
            </div>

            <!-- Experience Dates & Company -->
            <div id="exper" class="space-y-4">

                <div class="flex gap-4">
                    <div class="flex-1 flex flex-col">
                        <label for="dateOne" class="mb-1 font-medium">Date of start</label>
                        <input type="date" id="dateOne"
                            class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div class="flex-1 flex flex-col">
                        <label for="dateTwo" class="mb-1 font-medium">Date of finishing</label>
                        <input type="date" id="dateTwo"
                            class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                </div>

                <div class="flex gap-4">
                    <div class="flex-1 flex flex-col">
                        <label for="company" class="mb-1 font-medium">Name of company</label>
                        <input type="text" id="company" placeholder="Enter company name"
                            class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div class="flex-1 flex flex-col">
                        <label for="rol" class="mb-1 font-medium">Old role</label>
                        <select id="rol"
                            class="w-full h-10 px-3 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="manager">manager</option>
                            <option value="employee">employee</option>
                            <option value="security">security</option>
                            <option value="receptionist">receptionist</option>
                            <option value="cleaning employee">cleaning employee</option>
                            <option value="IT specifics">IT specifics</option>
                        </select>
                    </div>
                </div>

                <button id="btnTwo" class="w-48 h-10 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Add
                    Experience</button>
            </div>
        </div>

        <button id="btnTree" class="mt-4 w-48 h-10 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Add
            Formation</button>
    </div>



    <script src="main.js"></script>

</body>

</html>
